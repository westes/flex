name: Build and Test

on:
  push:
    branches: [ master ]
    tags-ignore:
    - 'v*'
  pull_request:
    branches: [ master ]
  workflow_call:
    inputs:
      image:
        description: Run in this image instead of the one in .github/ci-image-ref
        type: string
        default: ''

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/ci-image-ref.yml
    permissions:
      contents: read

  build:
    needs: image

    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    name: build (${{ matrix.cc }})
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
    runs-on: ubuntu-22.04
    container: ${{ inputs.image || needs.image.outputs.ref }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check VERBOSE=1
    - name: make distcheck
      run: make distcheck
