name: Build and Test

on:
  push:
    branches: [ master ]
    tags-ignore:
    - 'v*'
  pull_request:
    branches: [ master ]

permissions: read-all

jobs:
  build:

    runs-on: ubuntu-22.04
    container: ghcr.io/westes/flex-ci@sha256:d12b538158a6eb131eb72f507ff17e937d0d8b01d4cdf2d42d510742b71f99b6

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check VERBOSE=1
    - name: make distcheck
      run: make distcheck
